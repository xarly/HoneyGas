# systemd drop-in for tailscaled on a HoneyGas honeypot VM (Tailscale overlay,
# docs/deployment-wazuh.md section 8).
#
# Install:
#   sudo install -D -m 0644 deploy/tailscaled-egress.conf \
#     /etc/systemd/system/tailscaled.service.d/10-honeygas-egress.conf
#   sudo systemctl daemon-reload && sudo systemctl restart tailscaled
#
# The host firewall (deploy/nftables-honeypot.nft) blocks and counts all egress
# except the overlay. With Tailscale, the overlay's transport is tailscaled's
# own traffic (control plane, relays, direct peer UDP), whose destinations are
# not fixed. So the firewall lets out one PROCESS instead of one destination:
# whatever runs in this service's cgroup.
#
# nftables turns a cgroup path into an id when the rule is added, and the id
# changes every time the service restarts. So the rule is rebuilt here, in
# ExecStartPre, which already runs inside the service's new cgroup, before
# tailscaled itself starts. If the firewall table is missing, this fails and
# tailscaled does not start: fail closed (the agent goes silent, which alerts).
#
# Reloading the firewall recreates the chain empty: restart tailscaled after.

[Service]
ExecStartPre=/usr/sbin/nft flush chain inet honeygas_host tailscaled_egress
ExecStartPre=/usr/sbin/nft add rule inet honeygas_host tailscaled_egress socket cgroupv2 level 2 '"system.slice/tailscaled.service"' accept

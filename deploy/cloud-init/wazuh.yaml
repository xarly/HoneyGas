#cloud-config
# ============================================================================
# HoneyGas cloud-init (user-data) - WAZUH VM (SIEM / management)
# ----------------------------------------------------------------------------
# Paste as the VM's user-data on a minimal Debian image. Deploy in the private
# management subnet (no inbound from the internet). Needs ~4 GB RAM for the
# Wazuh all-in-one stack.
#
# Replace the example values below:
#   - the git URL (a repo you control; see the SECURITY note),
#   - HONEYPOT_CIDR (DMZ range allowed to send agent traffic on 1514/1515),
#   - ADMIN_CIDR (range allowed to reach the dashboard on 443).
# The CIDR values shown are RFC 1918 examples, not a real network.
#
# SECURITY: instance user-data is frequently readable from the metadata
# service. Put NO secrets here. The dashboard admin password is generated by
# the Wazuh installer and saved to wazuh-install-files.tar on the VM.
# ============================================================================
hostname: mgmt-siem-01
package_update: true
packages: [git, ca-certificates, curl]

runcmd:
  - [bash, -lc, "git clone --depth 1 https://git.example.com/you/HoneyGas.git /opt/honeygas/src"]
  - [bash, -lc, "MISSION=wazuh HONEYPOT_CIDR=10.10.0.0/24 ADMIN_CIDR=10.0.0.0/24 /opt/honeygas/src/deploy/provision.sh"]

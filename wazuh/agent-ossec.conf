<!--
  Wazuh agent config for a HoneyGas VM (runs on the HOST, not inside the
  honeypot container). Merge these blocks into /var/ossec/etc/ossec.conf, set
  the manager address, register the agent, and assign it to the group matching
  its site (gaseoducto or biometano):

    agent-auth -m 10.20.0.10                         # enrol to the manager
    # on the manager: assign the agent to its group
    /var/ossec/bin/agent_groups -a -i <AGENT_ID> -g gaseoducto

  The container has no egress; THIS agent is the telemetry path. It reads the
  bind-mounted data volume and ships the complete JSON trail to the manager.
-->
<ossec_config>

  <client>
    <server>
      <address>10.20.0.10</address>   <!-- Wazuh manager (management subnet) -->
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>10.20.0.10</manager_address>
    </enrollment>
  </client>

  <!-- Complete HoneyGas audit trail (JSON, one object per line). -->
  <localfile>
    <log_format>json</log_format>
    <location>/opt/honeygas/data/audit/honeygas-audit.jsonl</location>
  </localfile>

  <!-- Captured-artifact inventory: hashes + type only, never the samples. -->
  <localfile>
    <log_format>json</log_format>
    <location>/opt/honeygas/data/quarantine/inventory.jsonl</location>
  </localfile>

  <!-- Host integrity: the honeypot container FS is read-only, so ANY change to
       the VM's system paths is a possible breakout / persistence attempt and a
       trigger to rebuild. The honeypot data dir is excluded (it changes by
       design). Pairs with Wazuh's built-in syscheck rules (550 modified / 554
       added) and the agent-disconnect rules (503/505/506) for "box went dark". -->
  <syscheck>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/etc,/bin,/sbin,/usr/bin,/usr/sbin,/root,/home</directories>
    <ignore>/opt/honeygas/data</ignore>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

</ossec_config>

# ============================================================================
# HoneyGas deployment config - PLANTA BIOMETANO instance (biomethane profile)
# ----------------------------------------------------------------------------
# One of two independent instances. Deploy on its OWN VM, with its OWN public
# IP, in the DMZ subnet (see docs/deployment-wazuh.md). Keep it on a different
# address range / ASN from the gaseoducto instance so the two do not look like
# the same operator.
# ============================================================================

mode: biomethane
site_name: "BIO-PLANT-01"          # distinct per site; stamped on every event
bind_address: "0.0.0.0"

simulation:
  tick_seconds: 2.0

logging:
  audit_file: "/data/audit/honeygas-audit.jsonl"
  level: "INFO"
  echo_stdout: false

quarantine:
  dir: "/data/quarantine"
  max_capture_bytes: 10485760
  enable_yara: false
  yara_rules: "config/rules.yar"

isolation:
  session_idle_timeout_seconds: 1800
  limits:
    max_connections_per_ip: 32
    max_total_connections: 512
    connection_rate_per_minute: 240
    max_sessions: 8192
    max_overlay_entries: 4096
    max_store_entries: 256

# See the note in honeygas.transport.yaml: disabled because the container has no
# egress; the host Wazuh agent ships the full trail.
alerts:
  enabled: false
  min_severity: high
  syslog:
    enabled: true
    host: "10.20.0.10"
    port: 514
    protocol: udp
    facility: 16

# A biomethane upgrading & grid-injection plant. No Veeder-Root ATG here (a
# biomethane plant would not expose a fuel-tank gauge), so the atg_veeder
# listener is intentionally omitted.
listeners:
  - {name: modbus, type: modbus,   port: 502,   enabled: true}
  - {name: hmi,    type: http_hmi, port: 8080,  enabled: true}
  - {name: s7comm, type: s7comm,   port: 102,   enabled: true, label: "S7comm / ISO-TSAP (Siemens S7)"}
  - {name: iec104, type: iec104,   port: 2404,  enabled: true, label: "IEC 60870-5-104"}
  - {name: dnp3,   type: dnp3,     port: 20000, enabled: true, label: "DNP3"}

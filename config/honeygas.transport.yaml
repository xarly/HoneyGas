# ============================================================================
# HoneyGas deployment config - GASEODUCTO instance (transport profile)
# ----------------------------------------------------------------------------
# One of two independent instances. Deploy on its OWN VM, with its OWN public
# IP, in the DMZ subnet (see docs/deployment-wazuh.md). A single VM must never
# run both profiles: a gas-transport station and a biomethane plant behind the
# same address is an obvious tell.
# ============================================================================

mode: transport
site_name: "EDR-GAS-NODE-07"       # distinct per site; stamped on every event
bind_address: "0.0.0.0"

simulation:
  tick_seconds: 2.0

logging:
  # Absolute paths: these live on the mounted data volume, which the host-based
  # Wazuh agent tails and ships. echo_stdout off -> the SIEM is the sink.
  audit_file: "/data/audit/honeygas-audit.jsonl"
  level: "INFO"
  echo_stdout: false

quarantine:
  dir: "/data/quarantine"
  max_capture_bytes: 10485760
  enable_yara: false
  yara_rules: "config/rules.yar"

isolation:
  session_idle_timeout_seconds: 1800
  limits:
    max_connections_per_ip: 32
    max_total_connections: 512
    connection_rate_per_minute: 240
    max_sessions: 8192
    max_overlay_entries: 4096
    max_store_entries: 256

# Out-of-band CEF alert sink. DISABLED here on purpose: the honeypot container
# runs with NO egress (docker `internal` network), so it cannot reach the SIEM
# directly -- telemetry leaves via the host Wazuh agent instead (full JSON
# trail). Only enable this, and relax the egress firewall to allow exactly
# honeypot -> Wazuh:514, if you also want the direct real-time CEF channel.
alerts:
  enabled: false
  min_severity: high
  syslog:
    enabled: true
    host: "10.99.0.1"              # Wazuh hub (WireGuard overlay)
    port: 514
    protocol: udp
    facility: 16

# A gas transport & distribution station: RTU/flow computer, custody metering,
# pressure regulation, odorant injection, and a Veeder-Root ATG.
listeners:
  - {name: modbus, type: modbus,     port: 502,   enabled: true}
  - {name: hmi,    type: http_hmi,   port: 8080,  enabled: true}
  - {name: atg,    type: atg_veeder, port: 10001, enabled: true, label: "Veeder-Root ATG"}
  - {name: s7comm, type: s7comm,     port: 102,   enabled: true, label: "S7comm / ISO-TSAP (Siemens S7)"}
  - {name: iec104, type: iec104,     port: 2404,  enabled: true, label: "IEC 60870-5-104"}
  - {name: dnp3,   type: dnp3,       port: 20000, enabled: true, label: "DNP3"}

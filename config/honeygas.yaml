# ============================================================================
# HoneyGas - main configuration
# ----------------------------------------------------------------------------
# Defensive ICS/OT honeypot for gas transport/distribution and biomethane.
#
# DEPLOY ONLY in an isolated, authorized network segment that you own.
# See README.md (sections "Safety" and "Deployment") before exposing it.
# ============================================================================

# Operating mode: selects the device/process profile to emulate.
#   transport  -> gas transport & distribution station (RTU, flow computers, ATG)
#   biomethane -> biomethane upgrading & grid-injection plant
mode: transport

site_name: "EDR-GAS-NODE-07"      # cosmetic identifier shown in banners/HMI
bind_address: "0.0.0.0"           # interface to bind listeners to

simulation:
  tick_seconds: 2.0               # how often simulated process values advance

logging:
  audit_file: "data/audit/honeygas-audit.jsonl"
  level: "INFO"
  echo_stdout: true

quarantine:
  dir: "data/quarantine"
  max_capture_bytes: 10485760     # 10 MiB cap per captured payload
  enable_yara: false              # requires yara-python + a rules file
  yara_rules: "config/rules.yar"

isolation:
  # Application-level isolation: each source IP gets its own sandboxed copy
  # of the writable device state (an overlay on top of the shared baseline),
  # so one attacker's writes never leak into another attacker's view.
  # Network/host isolation is provided by docker/docker-compose.yml.
  session_idle_timeout_seconds: 1800

  # Per-attacker resource quotas -- the in-process equivalent of a container's
  # cgroup/pids limits. They stop one source IP from exhausting the shared
  # honeypot process (connections, new-connection floods, session memory) and
  # so degrading observation of every other attacker. 0 = unlimited.
  # Defaults are generous so ordinary scanners are never tripped; tighten for
  # an exposed deployment. Breaches are audited as isolation.* events.
  limits:
    max_connections_per_ip: 32        # concurrent connections from one source
    max_total_connections: 512        # concurrent connections across all sources
    connection_rate_per_minute: 240   # new connections/minute from one source
    max_sessions: 8192                # live sessions before LRU reclaim
    max_overlay_entries: 4096         # writable points held per session
    max_store_entries: 256            # scratch keys held per session

# Out-of-band alerting (the "push" side of the audit log). High-signal events
# (>= min_severity) are forwarded, as they happen, to YOUR OWN monitoring --
# never to the attacker. Delivery runs on a background thread, so a slow or
# unreachable SIEM never blocks the honeypot; failures are best-effort.
# Disabled by default; the destinations below are examples. The full audit
# trail is always written to the audit file regardless of these settings.
alerts:
  enabled: false
  min_severity: high                # debug|info|notice|warning|high|critical
  queue_size: 2048                  # events buffered before new ones are dropped
  syslog:
    enabled: false
    host: "127.0.0.1"               # your SIEM / syslog collector
    port: 514
    protocol: udp                   # udp | tcp  (CEF format: ArcSight/QRadar/Splunk/rsyslog)
    facility: 16                    # 16 = local0
  webhook:
    enabled: false
    url: ""                         # https endpoint that receives a JSON POST per event
    timeout_seconds: 4.0
    headers: {}                     # e.g. {Authorization: "Bearer ..."}

# Services (listeners) to expose. Disable any you do not want.
# Ports are the ICS defaults; remap them if you prefer.
listeners:
  - name: modbus
    type: modbus
    port: 502
    enabled: true

  - name: hmi
    type: http_hmi
    port: 8080
    enabled: true

  - name: atg
    type: atg_veeder
    port: 10001
    enabled: true

  - name: s7comm
    type: s7comm
    port: 102
    enabled: true
    label: "S7comm / ISO-TSAP (Siemens S7)"

  - name: iec104
    type: iec104
    port: 2404
    enabled: true
    label: "IEC 60870-5-104"

  - name: dnp3
    type: dnp3
    port: 20000
    enabled: true
    label: "DNP3"
